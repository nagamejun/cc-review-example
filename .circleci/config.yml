version: 2.1
jobs:
  claude-review:
    docker:
      - image: cimg/node:24.13.0
    steps:
      - checkout
      - run:
          name: Install Claude Code
          no_output_timeout: 3m
          command: |
            set -euo pipefail
            npm install -g @anthropic-ai/claude-code@2.1.51
            claude --version | grep -qF "2.1.51"
      - run:
          name: Setup Claude Config
          command: |
            set -euo pipefail
            # Claude Code を非対話モードで動かすには hasCompletedOnboarding が必要
            mkdir -p ~/.claude
            echo '{"hasCompletedOnboarding": true}' > ~/.claude/config.json
      - run:
          name: Run PR Review
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            # CLAUDE_CODE_OAUTH_TOKEN は CircleCI がプロジェクト環境変数として自動 export 済み
            # GH_TOKEN は CircleCI の命名規則のため、claude が期待する GITHUB_TOKEN に明示的に再マップする
            if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
              echo "ERROR: CLAUDE_CODE_OAUTH_TOKEN not set in CircleCI project environment variables" >&2; exit 1
            fi
            if [ -z "${GH_TOKEN}" ]; then
              echo "ERROR: GH_TOKEN not set in CircleCI project environment variables" >&2; exit 1
            fi
            export GITHUB_TOKEN="$GH_TOKEN"
            claude -p "/pr-review-toolkit:review-pr" 2>&1 | tee /tmp/review-output.txt
            if [ ! -s /tmp/review-output.txt ]; then
              echo "ERROR: claude produced no output — review may have failed silently" >&2
              exit 1
            fi
      - run:
          name: Post Review Comment
          command: |
            set -euo pipefail
            if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              echo "PR が検出されませんでした。コメントの投稿をスキップします"
              exit 0
            fi
            PR_NUMBER=$(echo "$CIRCLE_PULL_REQUEST" | grep -oE '[0-9]+$')
            echo "PR番号: $PR_NUMBER"
            echo "リポジトリ: ${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            echo "review-output.txt サイズ: $(wc -c < /tmp/review-output.txt) bytes"
            # shell 置換 $(...) はトレイリング改行を削除するため、ファイルに書き出して --data @file で渡す
            jq -Rs '{body: .}' /tmp/review-output.txt > /tmp/review-payload.json
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              --data @/tmp/review-payload.json \
              "https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/issues/${PR_NUMBER}/comments")
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
            BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
            echo "HTTP ステータス: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
              echo "ERROR: GitHub API エラー: $BODY" >&2
              exit 1
            fi

workflows:
  on-pr:
    jobs:
      - claude-review:
          filters:
            branches:
              ignore: main
